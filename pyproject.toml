[project]
name = "llmgateways"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NADENDLA HARSHA VARDHAN", email = "harshavardhannadendla9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-litellm>=0.11.1",
    "langchain-openai>=1.7.2",
    "litellm>=1.106.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llmgateways = "llmgateways:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
